<!-- ── HLTB MODAL ── -->
<div id="hltb-modal" class="modal-overlay sub-modal" style="display:none;" onclick="if(event.target===this)closeHltbModal();">
    <div class="modal-content" style="width:min(43.75rem,95vw); max-height:90vh; display:flex; flex-direction:column; overflow:hidden;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-shrink:0;">
            <h2 style="margin:0; color:var(--text-primary);">HLTB Data</h2>
            <button onclick="closeHltbModal()" style="background:none;border:none;color:var(--text-secondary);font-size:1.3rem;cursor:pointer;padding:0 4px;line-height:1;">✕</button>
        </div>

        <!-- Controls bar -->
        <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.5rem; flex-shrink:0;">
            <span style="font-size:0.78rem; color:#8f98a0; flex-shrink:0;">Auto-confirm threshold</span>
            <input type="range" id="hltb-review-slider" min="0" max="100"
                value="{{ hltb_match_threshold }}"
                oninput="_onHltbReviewSlider(this)"
                class="hltb-review-slider" data-modal-row="0">
            <span id="hltb-review-threshold-val" style="font-size:0.85rem; color:var(--text-primary); min-width:28px; text-align:right; flex-shrink:0;">{{ hltb_match_threshold }}</span>
        </div>
        <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.375rem; flex-shrink:0;">
            <button id="hltb-confirm-btn" class="nav-btn" style="font-size:0.78rem;" data-modal-row="1" onclick="_hltbConfirmAllAbove()">Confirm all above</button>
            <button id="hltb-scrape-btn" class="nav-btn" style="font-size:0.78rem;" data-modal-row="1" onclick="_hltbScrapeNoMatch()">Re-scrape unmatched</button>
            <button id="hltb-stop-btn" class="nav-btn" style="font-size:0.78rem; display:none; color:var(--color-danger);" data-modal-row="1" onclick="_hltbStopScrape()">Stop</button>
        </div>
        <div id="hltb-scrape-status" style="font-size:0.78rem; color:#8f98a0; min-height:1.1rem; margin-bottom:0.25rem; flex-shrink:0;"></div>
        <div id="hltb-review-stats" style="font-size:0.78rem; color:#8f98a0; margin-bottom:0.625rem; flex-shrink:0;"></div>

        <!-- Match list -->
        <div id="hltb-review-list" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:0.375rem;"></div>
    </div>
</div>

<style>
.hltb-review-slider {
    flex: 1; min-width: 0; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 2px;
    background: transparent; outline: none;
}
.hltb-review-slider::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--slider-pct, 75%), var(--bg-raised, #555) var(--slider-pct, 75%));
}
.hltb-review-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 0.875rem; height: 0.875rem; margin-top: -0.3125rem;
    border-radius: 50%; background: var(--accent); cursor: pointer;
}
.hltb-match-row {
    padding: 0.5rem 0.625rem; border-radius: 0.3125rem;
    border: 1px solid #2a475e; background: var(--bg-input);
    font-size: 0.8rem;
}
.hltb-match-row.above { border-color: #2a475e; }
.hltb-match-row.below { opacity: 0.55; border-color: #1e2e3a; }
.hltb-match-row.no-match { opacity: 0.7; border-color: #1e2e3a; }
.hltb-match-row .game-name { color: #c2c8cc; font-weight: 600; }
.hltb-match-row .match-name { color: #8f98a0; }
.hltb-match-row .score-badge {
    display: inline-block; font-size: 0.72rem; font-weight: bold;
    padding: 0.0625rem 0.375rem; border-radius: 0.1875rem; flex-shrink: 0;
}
.hltb-match-row .score-badge.above { background: rgba(92,126,16,0.25); color: #8bc34a; }
.hltb-match-row .score-badge.below { background: rgba(180,80,50,0.2); color: #e06c4a; }
.hltb-match-row .score-badge.no-match-badge { background: rgba(100,100,100,0.2); color: #6a7a86; }
.hltb-match-row .times { color: #8f98a0; font-size: 0.75rem; }
.hltb-match-row .row-btns { display: flex; gap: 6px; flex-shrink: 0; }
.hltb-alt-results { display: none; flex-direction: column; gap: 0.25rem; margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid #2a475e; }
.hltb-alt-results.open { display: flex; }
.hltb-alt-result-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0.375rem; border-radius: 0.25rem; background: rgba(255,255,255,0.03); font-size: 0.78rem; color: #c2c8cc; }
.hltb-alt-result-row:hover { background: rgba(255,255,255,0.07); }
.hltb-section-header {
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em;
    color: #4a5e6e; text-transform: uppercase;
    padding: 0.375rem 0.125rem 0.25rem; margin-top: 0.25rem;
    border-top: 1px solid #1e2e3a;
    cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 5px;
}
.hltb-section-header:first-child { margin-top: 0; border-top: none; }
.hltb-section-header:hover { color: #6a7a86; }
.hltb-chevron { font-size: 0.6rem; flex-shrink: 0; }
</style>

<script>
// ── HLTB MODAL ───────────────────────────────────────────────────────────────
let _hltbMatches          = [];
let _hltbNoMatchGames     = [];
let _hltbUnfetchedCount   = 0;
let _hltbSectionCollapsed = {};

function openHltbModal() {
    _hltbSectionCollapsed = { nomatch: true, confirmed: true };
    document.getElementById('hltb-modal').style.display = 'flex';
    _hltbLoadMatches();
    // Re-attach to a bulk HLTB job that's still running server-side (it keeps
    // going even if the modal was closed or the user navigated away).
    fetch('/api/bulk-op/status').then(r => r.json()).then(d => {
        if (d.running && (d.op === 'hltb' || d.op === 'hltb_confirm')) _hltbAttachBulkPoll();
    }).catch(() => {});
}

function closeHltbModal() {
    // Only stop the client-side poller — the server job keeps running.
    if (_hltbBulkInterval) { clearInterval(_hltbBulkInterval); _hltbBulkInterval = null; }
    document.getElementById('hltb-modal').style.display = 'none';
}

document.addEventListener('populate:hltb_done', () => {
    if (document.getElementById('hltb-modal')?.style.display === 'flex') {
        _hltbLoadMatches(true);
    }
});

function _hltbStatsText() {
    const confirmed = _hltbMatches.filter(r => r.hltb_fetched !== 'unconfirmed').length;
    const parts = [`${confirmed} confirmed`];
    if (_hltbUnfetchedCount) parts.push(`${_hltbUnfetchedCount} pending`);
    return parts.join(' · ');
}

function _onHltbReviewSlider(el) {
    document.getElementById('hltb-review-threshold-val').textContent = el.value;
    const pct = (el.value - el.min) / (el.max - el.min) * 100;
    el.style.setProperty('--slider-pct', pct + '%');
    _hltbRenderList();
}

function _hltbGetThreshold() {
    return parseInt(document.getElementById('hltb-review-slider').value, 10);
}

function _fmtMinsHltb(mins) {
    if (mins == null) return null;
    const h = Math.floor(mins / 60), m = mins % 60;
    return m > 0 ? `${h}h ${m}m` : `${h}h`;
}

function _hltbTimesStr(row) {
    const parts = [];
    if (row.hltb_main          != null) parts.push(`Main: ${_fmtMinsHltb(row.hltb_main)}`);
    if (row.hltb_extras        != null) parts.push(`+Extras: ${_fmtMinsHltb(row.hltb_extras)}`);
    if (row.hltb_completionist != null) parts.push(`Compl: ${_fmtMinsHltb(row.hltb_completionist)}`);
    return parts.join(' · ');
}

async function _hltbLoadMatches(live = false) {
    const list  = document.getElementById('hltb-review-list');
    const stats = document.getElementById('hltb-review-stats');
    if (!live) {
        list.innerHTML    = '<div style="color:#8f98a0; font-size:0.8rem; padding:8px;">Loading...</div>';
        stats.textContent = '';
    }
    try {
        const data = await fetch('/api/hltb/matches').then(r => r.json());
        if (!live) {
            _hltbMatches        = data.matches;
            _hltbNoMatchGames   = data.no_match_games || [];
            _hltbUnfetchedCount = data.unfetched_count;
            const slider = document.getElementById('hltb-review-slider');
            const pct = (slider.value - slider.min) / (slider.max - slider.min) * 100;
            slider.style.setProperty('--slider-pct', pct + '%');
            _hltbRenderList();
        } else {
            _hltbMergeLive(data.matches, data.no_match_games || [], data.unfetched_count);
        }
    } catch(e) {
        if (!live) list.innerHTML = '<div style="color:#ff6b6b; font-size:0.8rem; padding:8px;">Failed to load matches.</div>';
    }
}

function _hltbMergeLive(incoming, incomingNoMatch, unfetchedCount) {
    if (unfetchedCount != null) _hltbUnfetchedCount = unfetchedCount;

    const knownMatchIds   = new Set(_hltbMatches.map(r => r.appid));
    const addedMatches    = incoming.filter(r => !knownMatchIds.has(r.appid));
    if (addedMatches.length) _hltbMatches = _hltbMatches.concat(addedMatches);

    const knownNoMatchIds = new Set(_hltbNoMatchGames.map(r => r.appid));
    const addedNoMatch    = incomingNoMatch.filter(r => !knownNoMatchIds.has(r.appid));
    if (addedNoMatch.length) _hltbNoMatchGames = _hltbNoMatchGames.concat(addedNoMatch);

    if (addedMatches.length || addedNoMatch.length) {
        _hltbRenderList();
    } else {
        const stats = document.getElementById('hltb-review-stats');
        if (stats) stats.textContent = _hltbStatsText();
    }
}

function _hltbToggleSection(key) {
    _hltbSectionCollapsed[key] = !_hltbSectionCollapsed[key];
    const rows    = document.querySelector(`.hltb-section-rows[data-section="${key}"]`);
    const header  = document.querySelector(`.hltb-section-header[data-section="${key}"]`);
    const chevron = header?.querySelector('.hltb-chevron');
    if (rows)    rows.style.display    = _hltbSectionCollapsed[key] ? 'none' : '';
    if (chevron) chevron.textContent   = _hltbSectionCollapsed[key] ? '▶' : '▼';
}

function _hltbRenderList() {
    const threshold      = _hltbGetThreshold();
    const list           = document.getElementById('hltb-review-list');
    const stats          = document.getElementById('hltb-review-stats');
    const aboveUnconf    = _hltbMatches
        .filter(r => r.hltb_fetched === 'unconfirmed' && (r.hltb_match_score ?? 0) >= threshold)
        .sort((a, b) => b.hltb_match_score - a.hltb_match_score);
    const belowUnconf    = _hltbMatches
        .filter(r => r.hltb_fetched === 'unconfirmed' && (r.hltb_match_score ?? 0) < threshold)
        .sort((a, b) => b.hltb_match_score - a.hltb_match_score);
    const confirmedBelow = _hltbMatches
        .filter(r => r.hltb_fetched !== 'unconfirmed' && r.hltb_match_score != null && r.hltb_match_score < threshold)
        .sort((a, b) => b.hltb_match_score - a.hltb_match_score);

    stats.textContent = _hltbStatsText();

    const hasContent = aboveUnconf.length || belowUnconf.length || _hltbNoMatchGames.length || confirmedBelow.length;
    if (!hasContent) {
        const confirmed = _hltbMatches.filter(r => r.hltb_fetched !== 'unconfirmed').length;
        list.innerHTML = confirmed
            ? '<div style="color:#8f98a0; font-size:0.8rem; padding:8px;">All matches confirmed.</div>'
            : '<div style="color:#8f98a0; font-size:0.8rem; padding:8px;">No HLTB data yet — fetch will run automatically on next launch.</div>';
        return;
    }

    function plMatch(n) { return `${n} unconfirmed match${n !== 1 ? 'es' : ''}`; }

    // Sequential row counter starting after static rows (0=slider, 1=control buttons)
    let _r = 2;

    function section(key, label, items, rowFn) {
        const headerRow = _r++;
        const collapsed = !!_hltbSectionCollapsed[key];
        const rowsHtml = items.map(item => rowFn(item, _r++)).join('');
        return `<div class="hltb-section-header" data-section="${key}" data-modal-row="${headerRow}" onclick="_hltbToggleSection('${key}')">
            <span class="hltb-chevron">${collapsed ? '▶' : '▼'}</span>${label}
        </div>
        <div class="hltb-section-rows" data-section="${key}" style="${collapsed ? 'display:none' : ''}">
            ${rowsHtml}
        </div>`;
    }

    function matchRowHtml(row, seq) {
        const isConfirmed = row.hltb_fetched !== 'unconfirmed';
        const cls   = (row.hltb_match_score ?? 0) >= threshold ? 'above' : 'below';
        const times = _hltbTimesStr(row);
        return `<div class="hltb-match-row ${cls}" id="hltb-row-${row.appid}">
            <div style="display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap;">
                <div style="flex:1; min-width:0;">
                    <span class="game-name">${_escHtml(row.name)}</span>
                    <span style="color:#4a5e6e; margin:0 4px;">→</span>
                    <span class="match-name">${_escHtml(row.hltb_matched_name || '?')}</span>
                    <span class="score-badge ${cls}" style="margin-left:6px;">${row.hltb_match_score ?? '?'}</span>
                    ${isConfirmed ? '<span style="font-size:0.72rem; color:#8f98a0; margin-left:4px;">confirmed</span>' : ''}
                </div>
                <div class="row-btns">
                    ${!isConfirmed ? `<button class="nav-btn" style="font-size:0.72rem; padding:2px 7px;" data-modal-row="${seq}" onclick="_hltbRowConfirm(${row.appid})">Confirm</button>` : ''}
                    <button class="nav-btn" style="font-size:0.72rem; padding:2px 7px;" data-modal-row="${seq}" onclick="_hltbRowOtherMatch(${row.appid}, this)">Other match</button>
                    <button class="nav-btn" style="font-size:0.72rem; padding:2px 7px; color:var(--text-secondary);" data-modal-row="${seq}" onclick="_hltbRowClear(${row.appid})">Clear</button>
                </div>
            </div>
            ${times ? `<div class="times" style="margin-top:3px;">${times}</div>` : ''}
            <div class="hltb-alt-results" id="hltb-alt-${row.appid}"></div>
        </div>`;
    }

    function noMatchRowHtml(row, seq) {
        return `<div class="hltb-match-row no-match" id="hltb-row-${row.appid}">
            <div style="display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap;">
                <div style="flex:1; min-width:0;">
                    <span class="game-name">${_escHtml(row.name)}</span>
                    <span class="score-badge no-match-badge" style="margin-left:8px;">no match found</span>
                </div>
                <div class="row-btns">
                    <button class="nav-btn" style="font-size:0.72rem; padding:2px 7px;" data-modal-row="${seq}" onclick="_hltbNoMatchSearch(${row.appid}, this)">Search</button>
                </div>
            </div>
            <div class="hltb-alt-results" id="hltb-alt-${row.appid}"></div>
        </div>`;
    }

    let html = '';
    if (aboveUnconf.length)
        html += section('above', `${plMatch(aboveUnconf.length)} above threshold`, aboveUnconf, matchRowHtml);
    if (belowUnconf.length)
        html += section('below', `${plMatch(belowUnconf.length)} below threshold`, belowUnconf, matchRowHtml);
    if (_hltbNoMatchGames.length)
        html += section('nomatch', `${_hltbNoMatchGames.length} game${_hltbNoMatchGames.length !== 1 ? 's' : ''} with no match found`, _hltbNoMatchGames, noMatchRowHtml);
    if (confirmedBelow.length)
        html += section('confirmed', `${confirmedBelow.length} confirmed match${confirmedBelow.length !== 1 ? 'es' : ''} below threshold`, confirmedBelow, matchRowHtml);
    list.innerHTML = html;
}

function _escHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Flash a row's border and surface a message (in the stats line + toast).
function _hltbRowFlash(appid, ok) {
    const rowEl = document.getElementById(`hltb-row-${appid}`);
    if (!rowEl) return;
    rowEl.style.transition = 'border-color 0.2s';
    rowEl.style.borderColor = ok ? '#5c7e10' : 'var(--color-danger, #e06c4a)';
    setTimeout(() => { rowEl.style.borderColor = ''; }, 1500);
}

function _hltbNotify(msg) {
    const stats = document.getElementById('hltb-review-stats');
    if (stats) stats.textContent = msg;
    if (typeof showLaunchToast === 'function') showLaunchToast(msg);
}

// Accepts a bare HLTB game id, or a full URL in any of HLTB's forms:
//   howlongtobeat.com/game/13157      (current)
//   howlongtobeat.com/game?id=13157   (legacy)
//   https://.../game/13157/kingdom... (with slug/query)
// Returns the integer id, or null.
function _hltbParseId(raw) {
    if (!raw) return null;
    let m = raw.match(/(?:\/game[/?](?:id=)?)(\d+)/i);   // URL form
    if (!m) m = raw.match(/^\s*(\d+)\s*$/);              // bare id
    return m ? parseInt(m[1], 10) : null;
}

async function _hltbRowConfirm(appid) {
    const rowEl = document.getElementById(`hltb-row-${appid}`);
    const btn   = rowEl?.querySelector('button');
    if (btn) { btn.textContent = '...'; btn.disabled = true; }
    const restore = () => { if (btn) { btn.textContent = 'Confirm'; btn.disabled = false; } };
    try {
        const resp = await fetch(`/api/hltb/${appid}/confirm`, {method:'POST'});
        const data = await resp.json().catch(() => ({}));
        if (data.status === 'success') {
            const idx = _hltbMatches.findIndex(r => r.appid === appid);
            if (idx !== -1) Object.assign(_hltbMatches[idx], data.data);
            if (data.cleared) { _hltbRowFlash(appid, false); _hltbNotify(data.message || 'No HLTB times for that entry.'); }
            _hltbRenderList();
        } else {
            restore();
            _hltbRowFlash(appid, false);
            _hltbNotify(data.message || 'Confirm failed. Try again.');
        }
    } catch(e) {
        restore();
        _hltbRowFlash(appid, false);
        _hltbNotify('Confirm failed (network error).');
    }
}

async function _hltbRowClear(appid) {
    await fetch(`/api/hltb/${appid}`, {method:'DELETE'});
    _hltbMatches = _hltbMatches.filter(r => r.appid !== appid);
    _hltbUnfetchedCount++;
    _hltbRenderList();
}

async function _hltbRowOtherMatch(appid, btn) {
    const altEl = document.getElementById(`hltb-alt-${appid}`);
    if (altEl.classList.contains('open')) {
        altEl.classList.remove('open');
        btn.textContent = 'Other match';
        return;
    }
    btn.textContent = '...';
    btn.disabled = true;
    const rowData = _hltbMatches.find(r => r.appid === appid);
    await _hltbRowRunSearch(appid, rowData?.name || '');
    btn.textContent = 'Other match';
    btn.disabled = false;
}

async function _hltbNoMatchSearch(appid, btn) {
    const altEl = document.getElementById(`hltb-alt-${appid}`);
    if (altEl.classList.contains('open')) {
        altEl.classList.remove('open');
        btn.textContent = 'Search';
        return;
    }
    btn.textContent = '...';
    btn.disabled = true;
    const rowData = _hltbNoMatchGames.find(r => r.appid === appid);
    await _hltbRowRunSearch(appid, rowData?.name || '');
    btn.textContent = 'Search';
    btn.disabled = false;
}

function _hltbSetupAltDelegation(appid, altEl) {
    if (altEl._hltbDelegated) return;
    altEl._hltbDelegated = true;
    altEl.addEventListener('click', function(e) {
        const sel = e.target.closest('[data-hltb-select]');
        if (sel) { _hltbRowSelect(appid, parseInt(sel.dataset.hltbId), sel.dataset.hltbScore ? parseInt(sel.dataset.hltbScore) : null, sel.dataset.hltbName); return; }
        if (e.target.closest('[data-hltb-apply]')) { _hltbRowSelectById(appid); return; }
        if (e.target.closest('[data-hltb-research]')) {
            const input = altEl.querySelector('.hltb-row-search-query');
            if (input) _hltbRowRunSearch(appid, input.value.trim());
        }
    });
    altEl.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;
        if (e.target.classList.contains('hltb-row-search-query')) { e.preventDefault(); _hltbRowRunSearch(appid, e.target.value.trim()); }
        else if (e.target.classList.contains('hltb-row-manual-id')) { _hltbRowSelectById(appid); }
    });
}

async function _hltbRowRunSearch(appid, query) {
    let altEl = document.getElementById(`hltb-alt-${appid}`);
    if (!altEl) return;
    _hltbSetupAltDelegation(appid, altEl);
    try {
        const url = `/api/hltb/${appid}/search` + (query ? `?q=${encodeURIComponent(query)}` : '');
        const data = await fetch(url).then(r => r.json());
        altEl = document.getElementById(`hltb-alt-${appid}`);
        if (!altEl) return;
        _hltbSetupAltDelegation(appid, altEl);
        const results = data.results || [];
        const titleRowHtml = `<div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
            <input class="hltb-row-search-query" type="text" value="${_escHtml(query)}"
                data-modal-row="hltb-s-${appid}"
                style="flex:1; min-width:0; padding:4px 8px; font-size:0.78rem; background:var(--bg-input); border:1px solid #2a475e; border-radius:4px; color:var(--text-primary);">
            <button class="nav-btn" style="font-size:0.72rem; padding:2px 7px; flex-shrink:0;"
                data-modal-row="hltb-s-${appid}"
                data-hltb-research="1">Search</button>
        </div>`;
        const manualHtml = `<div style="display:flex; align-items:center; gap:6px; padding:6px 0 2px; border-top:1px solid #2a475e; margin-top:4px;">
            <input class="hltb-row-manual-id" id="hltb-manual-id-${appid}" type="text" placeholder="Paste HLTB URL or game ID…"
                data-modal-row="hltb-m-${appid}"
                style="flex:1; min-width:0; padding:4px 8px; font-size:0.78rem; background:var(--bg-input); border:1px solid #2a475e; border-radius:4px; color:var(--text-primary);">
            <button class="nav-btn" style="font-size:0.72rem; padding:2px 7px; flex-shrink:0;"
                data-modal-row="hltb-m-${appid}"
                data-hltb-apply="1">Apply</button>
        </div>`;
        const resultsHtml = results.length
            ? results.map((r, i) => {
                const times = [];
                if (r.hltb_main          != null) times.push(`Main: ${_fmtMinsHltb(r.hltb_main)}`);
                if (r.hltb_extras        != null) times.push(`+Extras: ${_fmtMinsHltb(r.hltb_extras)}`);
                if (r.hltb_completionist != null) times.push(`Compl: ${_fmtMinsHltb(r.hltb_completionist)}`);
                return `<div class="hltb-alt-result-row">
                    <span style="flex:1; min-width:0;">${_escHtml(r.hltb_matched_name)}</span>
                    <span style="color:#8f98a0; font-size:0.72rem; flex-shrink:0;">${r.hltb_match_score}</span>
                    <span style="color:#8f98a0; font-size:0.72rem; flex:1;">${times.join(' · ')}</span>
                    <button class="nav-btn" style="font-size:0.72rem; padding:2px 7px; flex-shrink:0;"
                        data-modal-row="hltb-r-${appid}-${i}"
                        data-hltb-select="1" data-hltb-id="${r.hltb_id}"
                        data-hltb-score="${r.hltb_match_score ?? ''}"
                        data-hltb-name="${_escHtml(r.hltb_matched_name)}">Select</button>
                </div>`;
            }).join('')
            : '<div style="color:#8f98a0; font-size:0.78rem; padding-bottom:4px;">No results found.</div>';
        altEl.innerHTML = titleRowHtml + resultsHtml + manualHtml;
        altEl.classList.add('open');
        _hltbRenumberRows();
    } catch(e) {
        altEl = document.getElementById(`hltb-alt-${appid}`) || altEl;
        altEl.innerHTML = '<div style="color:#ff6b6b; font-size:0.78rem;">Search failed.</div>';
        altEl.classList.add('open');
        _hltbRenumberRows();
    }
}

function _hltbRenumberRows() {
    const modal = document.getElementById('hltb-modal');
    if (!modal) return;
    const all = [...modal.querySelectorAll('[data-modal-row]')];
    let seq = 0;
    const seen = new Map();
    for (const el of all) {
        const key = el.dataset.modalRow;
        if (!seen.has(key)) seen.set(key, seq++);
    }
    for (const el of all) {
        el.dataset.modalRow = seen.get(el.dataset.modalRow);
    }
}

async function _hltbRowSelect(appid, hltbId, score, matchedName) {
    try {
        const data = await fetch(`/api/hltb/${appid}/select`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({hltb_id: hltbId, hltb_match_score: score})
        }).then(r=>r.json());
        if (data.status === 'success') {
            const nmIdx = _hltbNoMatchGames.findIndex(r => r.appid === appid);
            if (nmIdx !== -1) {
                const nmGame = _hltbNoMatchGames.splice(nmIdx, 1)[0];
                _hltbMatches.push({...data.data, appid, name: nmGame.name, hltb_matched_name: matchedName, hltb_id: hltbId});
            } else {
                const idx = _hltbMatches.findIndex(r => r.appid === appid);
                if (idx !== -1) Object.assign(_hltbMatches[idx], data.data, {hltb_matched_name: matchedName, hltb_id: hltbId});
            }
            _hltbRenderList();
        }
    } catch(e) {}
}

async function _hltbRowSelectById(appid) {
    const input = document.getElementById(`hltb-manual-id-${appid}`);
    if (!input) return;
    const raw = input.value.trim();
    if (!raw) return;
    const hltbId = _hltbParseId(raw);
    if (!hltbId) { input.style.borderColor = 'var(--color-danger)'; _hltbNotify('Enter an HLTB game ID or URL.'); return; }
    input.style.borderColor = '';
    input.disabled = true;
    try {
        const resp = await fetch(`/api/hltb/${appid}/select`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({hltb_id: hltbId, hltb_match_score: null})
        });
        const data = await resp.json().catch(() => ({}));
        if (data.status === 'success') {
            const nmIdx = _hltbNoMatchGames.findIndex(r => r.appid === appid);
            if (nmIdx !== -1) {
                const nmGame = _hltbNoMatchGames.splice(nmIdx, 1)[0];
                _hltbMatches.push({...data.data, appid, name: nmGame.name, hltb_id: hltbId});
            } else {
                const idx = _hltbMatches.findIndex(r => r.appid === appid);
                if (idx !== -1) {
                    Object.assign(_hltbMatches[idx], data.data, {hltb_id: hltbId});
                    if (!data.times_available) _hltbMatches = _hltbMatches.filter(r => r.appid !== appid);
                }
            }
            _hltbRenderList();
        } else {
            input.style.borderColor = 'var(--color-danger)';
            _hltbNotify(data.message || 'Could not apply that HLTB ID.');
        }
    } catch(e) {
        input.style.borderColor = 'var(--color-danger)';
        _hltbNotify('Could not apply that HLTB ID (network error).');
    }
    input.disabled = false;
}

async function _hltbConfirmAllAbove() {
    if (_hltbBulkInterval) return;                       // a bulk HLTB job is already running
    const threshold = _hltbGetThreshold();
    const targets   = _hltbMatches.filter(r => r.hltb_fetched === 'unconfirmed' && (r.hltb_match_score ?? 0) >= threshold);
    if (!targets.length) { _hltbNotify('No unconfirmed matches above the threshold.'); return; }
    if (!await confirm(`Confirm ${targets.length} unconfirmed match${targets.length !== 1 ? 'es' : ''} above threshold ${threshold}?`)) return;

    const statusEl = document.getElementById('hltb-scrape-status');
    statusEl.textContent = 'Starting…';
    const res = await fetch('/api/bulk-op/start', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({op: 'hltb_confirm', threshold})
    }).then(r => r.json()).catch(() => null);

    if (!res || res.status !== 'success') {
        statusEl.textContent = res?.message ? '✘ ' + res.message : '✘ Failed to start.';
        return;
    }
    document.dispatchEvent(new CustomEvent('bulkop:started'));
    _hltbAttachBulkPoll();
}

// ── Shared bulk-op driver (Confirm all above + Re-scrape unmatched) ──────────
// The server job runs in a daemon thread and survives closing the modal or
// navigating away; this poller just reflects its state while the modal is open.
let _hltbBulkInterval = null;

function _hltbBulkButtons(running) {
    const confirmBtn = document.getElementById('hltb-confirm-btn');
    const scrapeBtn  = document.getElementById('hltb-scrape-btn');
    const stopBtn    = document.getElementById('hltb-stop-btn');
    if (confirmBtn) { confirmBtn.style.opacity = running ? '0.5' : ''; confirmBtn.style.pointerEvents = running ? 'none' : ''; }
    if (scrapeBtn)  { scrapeBtn.style.display  = running ? 'none' : ''; }
    if (stopBtn)    { stopBtn.style.display    = running ? '' : 'none'; stopBtn.disabled = false; }
}

function _hltbBulkFinalText(d) {
    const r = d.result || {};
    if (r.error)   return '✘ ' + r.error;
    if (d.op === 'hltb_confirm' || r.cleared != null) {
        const bits = [`${r.done ?? 0} confirmed`];
        if (r.cleared) bits.push(`${r.cleared} had no time data`);
        if (r.failed)  bits.push(`${r.failed} failed`);
        return `Done. ${bits.join(', ')}.`;
    }
    return `Done. ${d.done} fetched${d.failed ? ', ' + d.failed + ' failed' : ''}.`;
}

function _hltbAttachBulkPoll() {
    if (_hltbBulkInterval) return;
    const statusEl = document.getElementById('hltb-scrape-status');
    _hltbBulkButtons(true);
    _hltbBulkInterval = setInterval(async () => {
        try {
            const d = await fetch('/api/bulk-op/status').then(r => r.json());
            const isHltb = d.op === 'hltb' || d.op === 'hltb_confirm';
            if (!d.running || !isHltb) {
                clearInterval(_hltbBulkInterval); _hltbBulkInterval = null;
                _hltbBulkButtons(false);
                if (isHltb) statusEl.textContent = _hltbBulkFinalText(d);
                _hltbLoadMatches(false);
                return;
            }
            const verb = d.op === 'hltb_confirm' ? 'Confirming' : 'Fetching';
            const done = d.done + d.failed;
            statusEl.textContent = `${verb} ${done} / ${d.total}${d.failed ? ` (${d.failed} failed)` : ''}`;
            if (d.done > 0) _hltbLoadMatches(true);
        } catch(e) {}
    }, 1000);
}

async function _hltbScrapeNoMatch() {
    if (_hltbBulkInterval) return;
    const statusEl = document.getElementById('hltb-scrape-status');
    statusEl.textContent = 'Starting…';
    const res = await fetch('/api/bulk-op/start', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({op: 'hltb', scope: 'no_match'})
    }).then(r => r.json()).catch(() => null);
    if (!res || res.status !== 'success') {
        statusEl.textContent = res?.message ? '✘ ' + res.message : '✘ Failed to start.';
        return;
    }
    document.dispatchEvent(new CustomEvent('bulkop:started'));
    _hltbAttachBulkPoll();
}

async function _hltbStopScrape() {
    document.getElementById('hltb-stop-btn').disabled = true;
    await fetch('/api/bulk-op/cancel', {method: 'POST'}).catch(() => {});
}
</script>
