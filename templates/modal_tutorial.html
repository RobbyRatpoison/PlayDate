<!-- -- TUTORIAL MODAL -- -->
<div id="tutorial-modal" class="modal-overlay" style="display:none; z-index:99998;" onclick="if(event.target===this)closeTutorialModal();">
    <div class="modal-content" id="tutorial-modal-content" style="width:min(620px,92vw); max-height:80vh; display:flex; flex-direction:column; overflow:hidden;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-shrink:0;">
            <h2 style="margin:0; color:var(--text-primary);">Tutorial</h2>
            <button onclick="closeTutorialModal()" style="background:none;border:none;color:var(--text-secondary);font-size:1.3rem;cursor:pointer;padding:0 4px;line-height:1;">✕</button>
        </div>

        <!-- Table of contents and the active section's step view are never
             shown at the same time, so both are just full-width siblings in a
             single flex column rather than columns of a grid (a grid with
             fixed tracks would auto-place whichever one is visible into the
             first track, leaving the other empty -- simplest fix is to not
             have separate tracks to begin with). -->
        <div style="display:flex; flex-direction:column; flex:1; min-height:0;">

            <!-- Table of contents. Padding here (not just on .modal-content) --
                 the gamepad-focus outline (outline-offset:2px) needs a few px
                 of room inside this scroll container's own edge, or it gets
                 clipped by overflow-y:auto before it ever reaches the modal's
                 outer padding. -->
            <div id="tutorial-toc" style="overflow-y:auto; flex:1; min-height:0; padding:4px;">
                <!-- section rows injected by tutorial.js -->
            </div>

            <!-- Active section step. Fixed-height modal (see above) + a
                 separate scrollable text region here, with the Back/Sections/
                 Next row as its own flex-shrink:0 sibling rather than the
                 last child inside the scroll area -- otherwise those buttons
                 would sit at a different vertical position on every step
                 depending on how much text came before them, instead of
                 staying anchored to the bottom of the modal. -->
            <div id="tutorial-section-view" style="display:none; flex-direction:column; min-height:0; flex:1;">
                <div style="overflow-y:auto; min-height:0; flex:1; padding:4px;">
                    <div id="tutorial-step-progress" style="font-size:0.75rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px;"></div>
                    <h3 id="tutorial-step-title" style="margin:0 0 10px; color:var(--accent);"></h3>
                    <div id="tutorial-step-body" style="font-size:0.9rem; line-height:1.65; color:var(--text-primary);"></div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:4px; flex-shrink:0; gap:8px;">
                    <button class="nav-btn" data-modal-row="9" onclick="_tutBack()" id="tutorial-back-btn" style="min-width:5rem;">Back</button>
                    <button class="nav-btn" data-modal-row="9" onclick="_tutShowToc()" style="min-width:6rem;">Sections</button>
                    <button class="btn-save" data-modal-row="9" onclick="_tutNext()" id="tutorial-next-btn" style="margin:0; min-width:5rem; width:auto; padding:0.6rem 1.2rem;">Next</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/tutorial.js') }}?v={{ app_version }}"></script>
