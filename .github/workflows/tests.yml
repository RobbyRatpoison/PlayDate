name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 matches the Windows build; 3.14 matches source installs
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          # pythonnet is a Windows-only pywebview dependency; skip it on Linux CI
          grep -vi pythonnet requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v
