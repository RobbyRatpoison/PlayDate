name: Warm Flatpak build cache

# The real build (build-windows.yml "Build Releases") is triggered by version
# tags. GitHub Actions cache is partitioned by GITHUB_REF, and a run can only
# restore caches from its own ref or the default branch (main) -- so every
# `vX.Y.Z` / `vX.Y.Z-beta.N` tag build gets a cold cache and recompiles
# tcl + tk + tkinter from source (~5 min of the ~8 min job), because nothing
# ever populates a flatpak-builder cache on `refs/heads/main`.
#
# This workflow does exactly that: it runs the same manifest-patch + cache +
# flatpak-builder steps as the real job, on main, so the `flatpak-builder-*`
# and `flatpak-runtime-*` caches exist in the one scope tag builds can read.
# It produces no bundle, no release, no artifact -- only the caches.
#
# Runs: on a main push that touches the manifest or the flatpak requirements
# (the only things that change what gets built); twice a week to stay ahead
# of the 7-day cache eviction during quiet periods; and on demand.

on:
  push:
    branches: [main]
    paths:
      - 'flatpak/io.github.robbyratpoison.PlayDate.yml'
      - 'flatpak/io.github.robbyratpoison.PlayDate.Qt.yml'
      - 'flatpak/requirements-flatpak.txt'
      - 'flatpak/requirements-flatpak-qt.txt'
      - '.github/workflows/flatpak-cache.yml'
  schedule:
    - cron: '0 4 * * 1,4'
  workflow_dispatch:

# One warm-up at a time; a newer push supersedes an in-progress run.
concurrency:
  group: flatpak-cache
  cancel-in-progress: true

jobs:
  warm:
    name: Build & cache flatpak modules
    runs-on: ubuntu-latest
    strategy:
      # Matches build-windows.yml's build-flatpak matrix -- see that file for
      # the full rationale. Both variants' caches need warming on main, since
      # a tag build reads whichever of these a release actually needs.
      fail-fast: false
      matrix:
        variant: [qt, gtk]
        include:
          - variant: gtk
            manifest: flatpak/io.github.robbyratpoison.PlayDate.yml
            requirements: flatpak/requirements-flatpak.txt
            runtime_id: org.gnome.Platform
            sdk_id: org.gnome.Sdk
            extra_runtime_refs: ""
          - variant: qt
            manifest: flatpak/io.github.robbyratpoison.PlayDate.Qt.yml
            requirements: flatpak/requirements-flatpak-qt.txt
            runtime_id: org.kde.Platform
            sdk_id: org.kde.Sdk
            extra_runtime_refs: "com.riverbankcomputing.PyQt.BaseApp"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Identical to build-windows.yml's step of the same name -- the cache
      # key below hashes this file, so the patch must match byte-for-byte for
      # the real build to get a hit.
      - name: Point manifest at the CI checkout
        shell: python
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          import os
          path = os.environ["MANIFEST"]
          old = (
              "      - type: git\n"
              "        url: https://github.com/RobbyRatpoison/PlayDate.git\n"
              "        tag: v1.5.21\n"
              "        dest: src"
          )
          new = (
              "      - type: dir\n"
              "        path: ..\n"
              "        dest: src\n"
              "        skip:\n"
              "          - flatpak\n"
              "          - .git\n"
              "          - .venv\n"
              "          - __pycache__\n"
              "          - webview_storage"
          )
          with open(path) as f:
              content = f.read()
          assert content.count(old) == 1, "manifest git-source block not found or not unique — update this step to match build-windows.yml"
          content = content.replace(old, new)
          with open(path, "w") as f:
              f.write(content)
          print(f"Patched {path} to build from the CI checkout")

      - name: Install flatpak tooling
        timeout-minutes: 5
        env:
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Read runtime version
        id: runtime_ver
        run: |
          ver=$(grep '^runtime-version:' ${{ matrix.manifest }} | sed "s/runtime-version: *//; s/[\"']//g")
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Cache Flatpak runtime and SDK
        uses: actions/cache@v6
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-${{ matrix.variant }}-${{ steps.runtime_ver.outputs.version }}

      - name: Install runtime and SDK
        run: |
          flatpak install --user -y flathub ${{ matrix.runtime_id }}//${{ steps.runtime_ver.outputs.version }} ${{ matrix.sdk_id }}//${{ steps.runtime_ver.outputs.version }}
          if [ -n "${{ matrix.extra_runtime_refs }}" ]; then
            flatpak install --user -y flathub ${{ matrix.extra_runtime_refs }}//${{ steps.runtime_ver.outputs.version }}
          fi

      # Key MUST match build-windows.yml byte-for-byte (see the long note
      # there). Not hashed over the manifest -- only pip requirements +
      # runtime version + a manual epoch; bump `e<N>` when a slow source
      # module (tcl/tk/_tkinter CPython) changes in the manifest.
      - name: Cache flatpak-builder state
        uses: actions/cache@v6
        with:
          path: .flatpak-builder
          key: flatpak-builder-e1-${{ matrix.variant }}${{ steps.runtime_ver.outputs.version }}-${{ hashFiles(matrix.requirements) }}
          restore-keys: |
            flatpak-builder-e1-${{ matrix.variant }}${{ steps.runtime_ver.outputs.version }}-
            flatpak-builder-e1-
            flatpak-builder-

      - name: Build with flatpak-builder (populates .flatpak-builder)
        run: |
          mkdir -p flatpak/repo
          flatpak-builder --user --repo=flatpak/repo --force-clean \
            flatpak/build-dir-${{ matrix.variant }} ${{ matrix.manifest }}
