name: Build Releases

# Triggers:
#   - Push a version tag like v1.0.0  → full build + GitHub Release
#   - Manual trigger via GitHub UI    → build only, no release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build-flatpak:
    name: Build & Package (Linux Flatpak)
    runs-on: ubuntu-latest
    # Runs before build-windows so it's the one job creating the GitHub
    # Release, with the .flatpak already attached — Windows attaches its own
    # assets to that release afterward. Flatpak intentionally builds first:
    # its job has much more setup (runtime/SDK install, flatpak-builder) and
    # used to finish well after Windows, leaving a window where a release
    # existed with no .flatpak asset yet — "Check for Updates" could find the
    # release and fail with "no flatpak bundle URL cached" until the Flatpak
    # job caught up.

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set version from tag ───────────────────────────────────────────────
      # Also patches config.py in this checkout (not just the PD_VERSION env
      # var used for the artifact filename) — the "Point manifest at the CI
      # checkout" step below copies this same working tree into the bundle
      # via `cp -r src/. ...`, so whatever's on disk here is what ships.
      - name: Set version from tag
        shell: python
        run: |
          import os, re
          tag = "${{ github.ref_name }}"
          m = re.match(r'^v?(\d+\.\d+\.\d+)', tag)
          ver = m.group(1) if m else "0.0.0"
          full = tag.lstrip('v')  # keeps any -beta.N/-rc.N suffix, unlike ver
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PD_VERSION={ver}\n")
          with open("config.py") as f: content = f.read()
          content = re.sub(r'__version__ = "[^"]+"', f'__version__ = "{ver}"', content)
          content = re.sub(r'__build__ = __version__', f'__build__ = "{full}"', content)
          with open("config.py", "w") as f: f.write(content)
          print(f"Version: {ver}, __build__ = {full}")

      # ── 2b. Update AppStream release metadata (stable releases only) ─────────
      # Shelly/GNOME Software/Discover read this file for the version they
      # display and update to — not the running app's own __version__, which
      # is a separate, already-correct mechanism. Skipped for -beta/-rc tags
      # since those never reach the ostree repo those tools pull from anyway
      # (see the gh-pages publish step below), so there's nothing for them to
      # show a beta version number for in the first place.
      - name: Update AppStream release metadata
        if: "!contains(github.ref_name, '-beta') && !contains(github.ref_name, '-rc')"
        shell: python
        run: |
          import re
          from datetime import date
          tag = "${{ github.ref_name }}"
          m = re.match(r'^v?(\d+\.\d+\.\d+)', tag)
          ver = m.group(1) if m else "0.0.0"
          today = date.today().isoformat()
          path = "flatpak/io.github.robbyratpoison.PlayDate.metainfo.xml"
          with open(path) as f:
              content = f.read()
          updated = re.sub(
              r'<release version="[^"]+" date="[^"]+"\s*/>',
              f'<release version="{ver}" date="{today}" />',
              content,
              count=1,
          )
          assert updated != content, "metainfo.xml <release> line not found — update this CI step"
          with open(path, "w") as f:
              f.write(updated)
          print(f"Set metainfo release to {ver} ({today})")

      # ── 3. Point the manifest at this checkout instead of a git tag ──────────
      # The manifest normally clones RobbyRatpoison/PlayDate at a fixed tag (so
      # local builds never pick up a developer's gitignored personal data). In
      # CI, actions/checkout already gives us a clean tree at the exact ref
      # being built (works for both tag pushes and manual workflow_dispatch
      # runs on a branch), so swap the git source for a local dir source.
      - name: Point manifest at the CI checkout
        shell: python
        run: |
          path = "flatpak/io.github.robbyratpoison.PlayDate.yml"
          old = (
              "      - type: git\n"
              "        url: https://github.com/RobbyRatpoison/PlayDate.git\n"
              "        tag: v1.5.21\n"
              "        dest: src"
          )
          new = (
              "      - type: dir\n"
              "        path: ..\n"
              "        dest: src\n"
              "        skip:\n"
              "          - flatpak\n"
              "          - .git\n"
              "          - .venv\n"
              "          - __pycache__\n"
              "          - webview_storage"
          )
          with open(path) as f:
              content = f.read()
          assert content.count(old) == 1, "manifest git-source block not found or not unique — update this CI step"
          content = content.replace(old, new)
          with open(path, "w") as f:
              f.write(content)
          print("Patched manifest to build from the CI checkout")

      # ── 4. Install flatpak + flatpak-builder ──────────────────────────────────
      # NEEDRESTART_MODE=a (automatic) stops Ubuntu's needrestart from popping
      # its "which services should be restarted?" prompt when apt installs a
      # package that touches a running service -- with no TTY attached on a
      # CI runner, that prompt just hangs the step forever instead of erroring
      # (observed: stuck 10+ minutes on this exact step, cancelled manually).
      # timeout-minutes is a second, independent safety net in case something
      # else ever hangs here too -- normally finishes in well under a minute.
      - name: Install flatpak tooling
        timeout-minutes: 5
        env:
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      # ── 4b. Cache the installed GNOME runtime + SDK ───────────────────────────
      # These are large (1GB+ combined) and get pulled from Flathub fresh on
      # every single run otherwise -- this was slow before any of the
      # tcl/tk/tkinter additions above. Keyed on the runtime-version value
      # itself (read separately below), not the whole manifest file, so
      # unrelated manifest edits (e.g. tweaking a build-commands step) don't
      # needlessly evict a ~1GB cache entry that's still perfectly valid.
      - name: Read runtime version
        id: runtime_ver
        run: |
          ver=$(grep '^runtime-version:' flatpak/io.github.robbyratpoison.PlayDate.yml | sed "s/runtime-version: *//; s/[\"']//g")
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Cache Flatpak runtime and SDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-gnome-${{ steps.runtime_ver.outputs.version }}

      # ── 5. Install the GNOME runtime + SDK ────────────────────────────────────
      # No-op (fast, exit 0) when the cache above already has these installed.
      - name: Install GNOME runtime and SDK
        run: flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      # ── 5b. Restore the published ostree repo so this build's commit is
      # appended to existing history instead of starting a fresh repo each
      # release — that history is what lets `flatpak update`/GNOME
      # Software/Shelly detect and pull just the new commit later.
      - name: Restore previous ostree repo from gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git clone --branch gh-pages --depth 1 "https://github.com/${{ github.repository }}.git" flatpak/repo
            rm -rf flatpak/repo/.git
          else
            mkdir -p flatpak/repo
          fi

      # ── 5c. Cache flatpak-builder's per-module state ──────────────────────────
      # .flatpak-builder/ holds downloaded sources plus a checksum per module
      # (hash of that module's manifest fragment + sources) that lets
      # flatpak-builder skip rebuilding a module untouched since the cached
      # run -- --force-clean below only wipes the final merged build-dir
      # output tree, not this. Slow, source-built deps (tcl, tk, the
      # from-source CPython used to build _tkinter) otherwise recompile from
      # scratch on every single push, beta or stable. Keyed on the manifest
      # + pip requirements so any real change still rebuilds what changed;
      # restore-keys falls back to the most recent cache on a miss so an
      # in-progress manifest edit still reuses whatever earlier modules
      # (e.g. tcl/tk) didn't change, rather than losing the whole cache.
      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('flatpak/io.github.robbyratpoison.PlayDate.yml', 'requirements-flatpak.txt') }}
          restore-keys: |
            flatpak-builder-

      # ── 6. Build and bundle ───────────────────────────────────────────────────
      - name: Build with flatpak-builder
        run: |
          flatpak-builder --user --repo=flatpak/repo --force-clean \
            flatpak/build-dir flatpak/io.github.robbyratpoison.PlayDate.yml

      # Refresh the repo summary so the newly appended commit is visible to
      # remote update checks (flatpak-builder's own export can lag behind
      # this on repos it didn't create fresh).
      - name: Update ostree repo summary
        run: flatpak build-update-repo flatpak/repo

      - name: Create .flatpak bundle
        run: |
          # --runtime-repo points installers (flatpak CLI, GNOME Software,
          # Discover) at Flathub so a missing org.gnome.Platform//50 runtime
          # is offered/fetched automatically on install, instead of failing
          # with "runtime not found" on a system that hasn't got Flathub
          # configured (e.g. a stock Steam Deck).
          flatpak build-bundle flatpak/repo \
            "PlayDate-${PD_VERSION}-Linux.flatpak" \
            io.github.robbyratpoison.PlayDate \
            --repo-url=https://robbyratpoison.github.io/PlayDate/ \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      # ── 7. Verify the build ───────────────────────────────────────────────────
      - name: Verify bundle output
        run: |
          f="PlayDate-${PD_VERSION}-Linux.flatpak"
          if [ -f "$f" ]; then
            echo "$f found"
            du -h "$f"
          else
            echo "::error::$f not found"
            exit 1
          fi

      # ── 8. Upload artifact (always) ───────────────────────────────────────────
      - name: Upload flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayDate-Linux-Flatpak
          path: PlayDate-${{ env.PD_VERSION }}-Linux.flatpak
          retention-days: 30

      # ── 9. Create the GitHub Release (only on version tags) ───────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: "PlayDate ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          body_path: RELEASE_NOTES.md
          files: PlayDate-${{ env.PD_VERSION }}-Linux.flatpak

      # ── 10. Publish the ostree repo (only on stable version tags) ─────────────
      # Serves flatpak/repo as a real remote via GitHub Pages, at the URL
      # baked into the bundle's --repo-url above. Installing the .flatpak
      # bundle then auto-registers this as the app's update remote, so
      # `flatpak update` and GUI package managers (GNOME Software, Shelly)
      # can detect new releases the normal flatpak way — no GitHub polling.
      # Requires Settings > Pages > "Deploy from a branch" > gh-pages once.
      #
      # Excludes -beta/-rc tags deliberately: this ostree repo is a single
      # shared channel with no stable/beta separation, so publishing a beta
      # build here would push it to every existing Flatpak install's native
      # `flatpak update`, not just users who opted into beta updates in-app.
      # Beta builds still get a GitHub Release with the .flatpak attached
      # (see the previous step) — that's the only distribution path for them.
      - name: Publish ostree repo to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-rc')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: flatpak/repo
          keep_files: false

  build-windows:
    name: Build & Package (Windows)
    runs-on: windows-latest
    # Runs after build-flatpak so the Flatpak job is the one creating the
    # GitHub Release (with the .flatpak already attached); this job just adds
    # the Windows assets to the release that already exists.
    needs: build-flatpak

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── 4. Set version from tag ───────────────────────────────────────────────
      - name: Set version from tag
        shell: python
        run: |
          import re
          tag = "${{ github.ref_name }}"
          m = re.match(r'^v?(\d+\.\d+\.\d+)', tag)
          ver = m.group(1) if m else "0.0.0"
          full = tag.lstrip('v')  # keeps any -beta.N/-rc.N suffix, unlike ver
          with open("config.py") as f: content = f.read()
          content = re.sub(r'__version__ = "[^"]+"', f'__version__ = "{ver}"', content)
          content = re.sub(r'__build__ = __version__', f'__build__ = "{full}"', content)
          with open("config.py", "w") as f: f.write(content)
          print(f"Set __version__ = {ver}, __build__ = {full}")

      # ── 5. Convert favicon.png → favicon.ico (Windows needs .ico) ────────────
      - name: Generate favicon.ico
        shell: python
        run: |
          from PIL import Image
          import os
          src = os.path.join("static", "img", "favicon.png")
          dst = os.path.join("static", "img", "favicon.ico")
          if os.path.exists(src):
              img = Image.open(src)
              img.save(dst, format="ICO", sizes=[(16,16),(32,32),(48,48),(256,256)])
              print(f"Created {dst}")
          else:
              print("favicon.png not found — skipping ico generation")

      # ── 6. Build with PyInstaller ─────────────────────────────────────────────
      - name: Build with PyInstaller
        run: pyinstaller playdate.spec

      # ── 6. Verify the build ───────────────────────────────────────────────────
      - name: Verify build output
        run: |
          if (Test-Path "dist\PlayDate\PlayDate.exe") {
            Write-Host "PlayDate.exe found"
            $size = (Get-Item "dist\PlayDate\PlayDate.exe").Length / 1MB
            Write-Host "  Size: $([math]::Round($size, 1)) MB"
          } else {
            Write-Error "PlayDate.exe not found in dist\PlayDate\"
            exit 1
          }

      # ── 7. Create portable zip ────────────────────────────────────────────────
      - name: Create portable zip
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = if ($tag -match '^v?(\d+\.\d+\.\d+)') { $matches[1] } else { "0.0.0" }
          $zip = "PlayDate-$ver-Windows-Portable.zip"
          Compress-Archive -Path "dist\PlayDate\*" -DestinationPath $zip
          $sizeMB = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Created $zip ($sizeMB MB)"
          echo "PORTABLE_ZIP=$zip" >> $env:GITHUB_ENV

      # ── 8. Install Inno Setup ─────────────────────────────────────────────────
      - name: Install Inno Setup 6
        run: |
          choco install innosetup --yes --no-progress
        shell: powershell

      # ── 9. Build installer with Inno Setup ────────────────────────────────────
      - name: Build installer with Inno Setup
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = if ($tag -match '^v?(\d+\.\d+\.\d+)') { $matches[1] } else { "0.0.0" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion="$ver" playdate.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: powershell

      # ── 10. Verify installer ───────────────────────────────────────────────────
      - name: Verify installer output
        run: |
          if (Test-Path "installer\PlayDate-Setup.exe") {
            Write-Host "PlayDate-Setup.exe found"
            $size = (Get-Item "installer\PlayDate-Setup.exe").Length / 1MB
            Write-Host "  Size: $([math]::Round($size, 1)) MB"
          } else {
            Write-Error "PlayDate-Setup.exe not found"
            exit 1
          }

      # ── 11. Upload artifacts (always) ─────────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayDate-Setup-Windows
          path: installer/PlayDate-Setup.exe
          retention-days: 30

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayDate-Windows-Portable
          path: ${{ env.PORTABLE_ZIP }}
          retention-days: 30

      # ── 12. Attach to the GitHub Release (only on version tags) ───────────────
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: "PlayDate ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          body_path: RELEASE_NOTES.md
          files: |
            installer/PlayDate-Setup.exe
            ${{ env.PORTABLE_ZIP }}
