id: io.github.robbyratpoison.PlayDate

# GNOME runtime ships GTK4, WebKit 6.0, and PyGObject already, which is what
# gtk4webview.py (main.py's Linux renderer fallback) targets — no separate
# GTK/WebKit build step needed. Check for newer runtime releases before
# building: `flatpak remote-ls flathub | grep org.gnome.Platform`
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

command: playdate

finish-args:
  # Steam/GOG/Epic libraries, Wine prefixes, and downloaded art/config can
  # live anywhere under $HOME — this app's whole job is bridging into that,
  # same as Lutris/Heroic/Bottles. Self-hosted distribution, not Flathub, so
  # there's no review pressure to narrow this down; it's a known tradeoff and
  # can be tightened later (see flatpak/README.md).
  - --filesystem=home
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # --device=all (not the narrower --device=input) is required for gamepad
  # support, notably the Steam Deck's built-in controller: WebKitGTK's
  # gamepad API goes through libmanette, which on Steam Deck has to open the
  # raw hidraw device directly to disable "lizard mode" (the controller's
  # default keyboard/mouse HID emulation) and keep re-disabling it every
  # ~800ms since Valve's hid-steam driver keeps trying to re-enable it.
  # --device=input covers /dev/input/event*|js* but explicitly dropped
  # hidraw support when it was introduced, so it can't reach that path.
  # Includes GPU (dri) access too, so this also replaces --device=dri.
  - --device=all
  # Required for flatpak-spawn --host, used by runners/sandbox.py to run
  # Wine/Proton/winetricks/7z on the host instead of inside the sandbox.
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: python3-requirements
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --no-build-isolation --prefix=/app -r requirements-flatpak.txt
    sources:
      - type: file
        path: requirements-flatpak.txt

  # org.gnome.Platform ships no Tcl/Tk at all — tkinter isn't a pip package,
  # it needs _tkinter compiled against real Tcl/Tk libs, and this runtime's
  # Python was built without them (the whole Lib/tkinter/ stdlib package is
  # absent too, not just the C extension). color_picker.py (library.py's
  # /api/pick-screen-color, the card-outline eyedropper's screen-grab
  # fallback for when the browser EyeDropper API isn't available in
  # WebKitGTK) needs it. Confirmed via a real Flatpak install's playdate.log:
  # `ModuleNotFoundError: No module named 'tkinter'`, subprocess exiting
  # before any window ever appeared.
  #
  # Built from upstream Tcl/Tk 8.6.14 source (not the GNOME/Flathub native
  # colour-chooser widget) deliberately: an earlier card-outline colour
  # picker used the browser-native `<input type="color">` (WebKitGTK's own
  # GTK colour-chooser dialog) and it was broken in this environment — see
  # CHANGELOG.md's v1.4.5 entry — which is why the custom HSV/hex/palette
  # picker with this Tk-based eyedropper exists at all. Going back to a GTK
  # colour-chooser widget risks resurrecting that bug; building real Tcl/Tk
  # instead doesn't touch it.
  - name: tcl
    buildsystem: simple
    subdir: unix
    strip: true
    build-commands:
      - ./configure --prefix=/app --enable-shared --disable-rpath
      - make
      - make install-binaries install-libraries install-headers
      # Tcl's own install rules leave libtcl8.6.so at mode 555 (no write
      # bit). flatpak-builder's post-install debuginfo extraction opens
      # installed .so files for writing (to split out .debug info) and
      # fails with "Permission denied" on a read-only file -- confirmed on
      # a real build, not just a local sandbox quirk. Neither `strip: true`
      # nor `no-debuginfo: true` sidesteps this; the fix is just making the
      # files writable ourselves before flatpak-builder's own pass runs.
      - find /app/lib -name '*.so' -exec chmod u+w {} +
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/tcl/Tcl/8.6.14/tcl8.6.14-src.tar.gz
        sha256: 5880225babf7954c58d4fb0f5cf6279104ce1cd6aa9b71e9a6322540e1c4de66

  - name: tk
    buildsystem: simple
    subdir: unix
    strip: true
    build-commands:
      - ./configure --prefix=/app --enable-shared --disable-rpath --with-tcl=/app/lib
      - make
      - make install-binaries install-libraries install-headers
      # Same read-only-install issue as the tcl module above.
      - find /app/lib -name '*.so' -exec chmod u+w {} +
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/tcl/Tcl/8.6.14/tk8.6.14-src.tar.gz
        sha256: 8ffdb720f47a6ca6107eac2dd877e30b0ef7fac14f3a84ebbd0b3612cee41a94

  # Builds the _tkinter C extension by hand (no full CPython rebuild) plus
  # copies the pure-Python Lib/tkinter/ package, both pulled from the exact
  # CPython tag matching org.gnome.Platform//50's bundled Python (3.13.14 —
  # check `flatpak run --command=python3 org.gnome.Sdk//50 -c "import sys;
  # print(sys.version)"` before bumping the runtime version, and update the
  # tag/path below to match). SITE/SUFFIX are computed instead of hardcoded
  # so this doesn't silently break if that Python's exact build tag changes.
  - name: tkinter
    buildsystem: simple
    strip: true
    build-commands:
      - |
        set -e
        SITE=$(python3 -c "import sysconfig; print(sysconfig.get_path('platlib'))")
        SUFFIX=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('EXT_SUFFIX'))")
        gcc -shared -fPIC -DNDEBUG -O2 $(python3-config --includes) -I/app/include \
            -o "_tkinter${SUFFIX}" Modules/_tkinter.c \
            -L/app/lib -Wl,-rpath,/app/lib -ltcl8.6 -ltk8.6
        mkdir -p "$SITE"
        install -Dm755 "_tkinter${SUFFIX}" "$SITE/_tkinter${SUFFIX}"
        cp -r Lib/tkinter "$SITE/tkinter"
    sources:
      - type: archive
        url: https://github.com/python/cpython/archive/refs/tags/v3.13.14.tar.gz
        sha256: 717bb341aadad00b23711922d5eded58dc3d5575cff9adf87234594713380992

  # Portal-forwarding xdg-open/xdg-email shims so the existing
  # subprocess.Popen(['xdg-open', url]) calls in app.py (steam://, http(s)://)
  # keep working unmodified from inside the sandbox.
  # Check for a newer release tag before building.
  - name: flatpak-xdg-utils
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/flatpak/flatpak-xdg-utils.git
        tag: '1.0.6'

  - name: playdate
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/playdate
      - cp -r src/. /app/share/playdate/
      - install -Dm755 playdate-wrapper.sh /app/bin/playdate
      - install -Dm644 io.github.robbyratpoison.PlayDate.desktop /app/share/applications/io.github.robbyratpoison.PlayDate.desktop
      - install -Dm644 io.github.robbyratpoison.PlayDate.metainfo.xml /app/share/metainfo/io.github.robbyratpoison.PlayDate.metainfo.xml
      # Generated at multiple exact hicolor sizes (source favicon.png is only
      # 250x250) — store frontends like Shelly/GNOME Software build their own
      # icon cache from the repo's appstream metadata and can silently drop
      # an icon that doesn't match its declared size folder, showing a
      # placeholder instead even though the running app's own window icon
      # (a separate, more forgiving GTK theme lookup) looks fine.
      # Written straight into /app rather than staging through /tmp first —
      # flatpak-builder gives each build-commands line its own ephemeral
      # sandbox, and unlike /app (the accumulating install tree, persisted
      # across commands), /tmp isn't shared between them, so a file saved to
      # /tmp here was already gone by the next line's install call.
      - python3 -c "from PIL import Image; import os; img = Image.open('/app/share/playdate/static/img/favicon.png').convert('RGBA'); [(os.makedirs(f'/app/share/icons/hicolor/{s}x{s}/apps', exist_ok=True), img.resize((s, s), Image.LANCZOS).save(f'/app/share/icons/hicolor/{s}x{s}/apps/io.github.robbyratpoison.PlayDate.png')) for s in (64, 128, 256, 512)]"
    sources:
      # Sourced from the git repo (not a raw directory copy of the working
      # tree) so gitignored personal data — config.json, games*.db,
      # state.json, cached art, tokens — can never end up bundled into the
      # app shipped to other people. Bump the tag at each release.
      - type: git
        url: https://github.com/RobbyRatpoison/PlayDate.git
        tag: v1.5.21
        dest: src
      - type: file
        path: playdate-wrapper.sh
      - type: file
        path: io.github.robbyratpoison.PlayDate.desktop
      - type: file
        path: io.github.robbyratpoison.PlayDate.metainfo.xml
